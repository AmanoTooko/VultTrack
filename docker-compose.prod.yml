services:
  postgres:
    image: postgres:16-alpine
    container_name: vultrack-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=6GB
      - -c
      - effective_cache_size=18GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=2GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=100
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.05
      - -c
      - autovacuum_vacuum_cost_limit=2000
      - -c
      - max_wal_size=8GB
      - -c
      - max_worker_processes=8
      - -c
      - max_parallel_workers=4
      - -c
      - max_parallel_workers_per_gather=2
    shm_size: "2g"
    env_file:
      - .env.production
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vultrack -d vultrack"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: src/VulTrack.App/Dockerfile
    container_name: vultrack-api
    restart: unless-stopped
    working_dir: /workspace/src/VulTrack.App
    env_file:
      - .env.production
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SYSTEM_NET_DISABLEIPV6: "1"
      VULTRACK_REPO_ROOT: /workspace
      VULTRACK_NORMALIZER_BACKEND: ${VULTRACK_NORMALIZER_BACKEND:-duckdb}
      VULTRACK_DUCKDB_ENABLED: ${VULTRACK_DUCKDB_ENABLED:-true}
      VULTRACK_AI_ENABLED: ${VULTRACK_AI_ENABLED:-false}
      VULTRACK_AI_BASE_URL: ${VULTRACK_AI_BASE_URL:-}
      VULTRACK_AI_API_KEY: ${VULTRACK_AI_API_KEY:-}
      VULTRACK_AI_MODEL: ${VULTRACK_AI_MODEL:-gemini-3.1-pro-preview}
      VULTRACK_AI_MAX_INPUT_CHARS: ${VULTRACK_AI_MAX_INPUT_CHARS:-12000}
      VULTRACK_AI_MAX_OUTPUT_TOKENS: ${VULTRACK_AI_MAX_OUTPUT_TOKENS:-1100}
    volumes:
      - .:/workspace
      - nuget-cache:/root/.nuget/packages
    command:
      - sh
      - -lc
      - >
        cd /workspace &&
        (test -d node_modules/pg || npm ci --omit=dev) &&
        cd /workspace/src/VulTrack.App &&
        dotnet run --urls http://0.0.0.0:8080
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vultrack-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api

volumes:
  nuget-cache:
