services:
  api:
    image: ${VULTRACK_API_IMAGE:?VULTRACK_API_IMAGE must pin a verified commit image}
    container_name: ${VULTRACK_API_CONTAINER:-vultrack-api}
    restart: unless-stopped
    working_dir: /app
    env_file:
      - path: .env
        required: false
      - path: .env.production
        required: false
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SYSTEM_NET_DISABLEIPV6: "1"
      VULTRACK_REPO_ROOT: /workspace
      VULTRACK_STORAGE_BACKEND: duckdb
      VULTRACK_DUCKDB_ENABLED: "true"
      VULTRACK_DUCKDB_PATH: ${VULTRACK_DUCKDB_PATH:?VULTRACK_DUCKDB_PATH must name the verified production file}
      VULTRACK_DUCKDB_MEMORY_LIMIT: ${VULTRACK_DUCKDB_MEMORY_LIMIT:-3g}
      VULTRACK_DUCKDB_THREADS: ${VULTRACK_DUCKDB_THREADS:-4}
      VULTRACK_SPOOL_PATH: /workspace/data/spool
      VULTRACK_STARTUP_MAINTENANCE: "false"
    mem_limit: "5g"
    volumes:
      - ./data:/workspace/data
      - ./import:/workspace/import:ro
    command: ["dotnet", "/app/VulTrack.App.dll"]

  frontend:
    image: ${VULTRACK_FRONTEND_IMAGE:?VULTRACK_FRONTEND_IMAGE must pin a verified commit image}
    container_name: ${VULTRACK_FRONTEND_CONTAINER:-vultrack-frontend}
    restart: unless-stopped
    ports:
      - "${VULTRACK_HTTP_PORT:-3000}:80"
    mem_limit: "128m"
    depends_on:
      - api
