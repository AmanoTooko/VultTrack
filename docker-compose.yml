services:
  postgres:
    image: postgres:16-alpine
    container_name: vultrack-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=100
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.05
      - -c
      - autovacuum_vacuum_cost_limit=2000
      - -c
      - max_wal_size=4GB
      - -c
      - max_worker_processes=4
      - -c
      - max_parallel_workers=2
      - -c
      - max_parallel_workers_per_gather=1
    shm_size: '1g'
    environment:
      POSTGRES_DB: vultrack
      POSTGRES_USER: vultrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vultrack}
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vultrack -d vultrack"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/VulTrack.App/Dockerfile
    container_name: vultrack-api
    restart: unless-stopped
    working_dir: /workspace/src/VulTrack.App
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DATABASE_URL: ${DATABASE_URL:-postgres://vultrack:vultrack@vultrack-postgres:5432/vultrack}
      VULTRACK_ADMIN_USERNAME: ${VULTRACK_ADMIN_USERNAME:-admin}
      VULTRACK_ADMIN_PASSWORD: ${VULTRACK_ADMIN_PASSWORD:-admin}
      VULTRACK_REPO_ROOT: /workspace
      VULTRACK_SCHEDULER_ENABLED: ${VULTRACK_SCHEDULER_ENABLED:-false}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-15}
      SCHEDULER_FETCH_TIMEOUT_SECONDS: ${SCHEDULER_FETCH_TIMEOUT_SECONDS:-1800}
      SCHEDULER_FETCH_LIMIT: ${SCHEDULER_FETCH_LIMIT:-}
      SCHEDULER_NORMALIZE_LIMIT: ${SCHEDULER_NORMALIZE_LIMIT:-5000}
      SCHEDULER_SOURCE_CODES: ${SCHEDULER_SOURCE_CODES:-}
      SCHEDULER_INCLUDE_INIT_SOURCES: ${SCHEDULER_INCLUDE_INIT_SOURCES:-false}
    volumes:
      - .:/workspace
    command: ["dotnet", "run", "--urls", "http://0.0.0.0:8080"]
    ports:
      - "5099:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vultrack-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

  adminer:
    image: adminer:4
    container_name: vultrack-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      - postgres
