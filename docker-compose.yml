services:
  postgres:
    image: postgres:16-alpine
    container_name: vultrack-postgres
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=128MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=4GB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=100
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.05
      - -c
      - autovacuum_vacuum_cost_limit=2000
      - -c
      - max_parallel_workers_per_gather=0
    shm_size: '256m'
    environment:
      POSTGRES_DB: vultrack
      POSTGRES_USER: vultrack
      POSTGRES_PASSWORD: vultrack
    ports:
      - "5432:5432"
    volumes:
      - vultrack_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vultrack -d vultrack"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/VulTrack.App/Dockerfile
    container_name: vultrack-api
    restart: unless-stopped
    working_dir: /workspace/src/VulTrack.App
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DATABASE_URL: postgres://vultrack:vultrack@vultrack-postgres:5432/vultrack
      VULTRACK_REPO_ROOT: /workspace
      VULTRACK_SCHEDULER_ENABLED: "true"
      SCHEDULER_INTERVAL_SECONDS: "5"
      SCHEDULER_FETCH_LIMIT:
      SCHEDULER_NORMALIZE_LIMIT: "500"
      SCHEDULER_SOURCE_CODES:
    volumes:
      - .:/workspace
    command: ["dotnet", "run", "--urls", "http://0.0.0.0:8080"]
    ports:
      - "5099:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: vultrack-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

  adminer:
    image: adminer:4
    container_name: vultrack-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      - postgres

volumes:
  vultrack_pgdata:
