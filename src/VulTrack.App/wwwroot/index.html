<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VulTrack Vulnerability Intelligence</title>
  <link rel="stylesheet" href="/styles.css?v=20260603-detail-ui">
</head>
<body>
  <main class="shell">
    <header class="topbar site-header">
      <div class="header-inner">
        <a class="brand-block" href="/" aria-label="VulTrack home">
          <span class="brand-mark" aria-hidden="true">VT</span>
          <div class="brand-copy">
            <h1>VulTrack</h1>
          </div>
        </a>

        <nav class="search-console" aria-label="Primary navigation">
          <div class="tabs" role="tablist" aria-label="Vulnerability intelligence sections">
            <button class="tab nav-tab is-active" type="button" data-mode="vulnerability">Vulnerabilities</button>
            <button class="tab nav-tab" type="button" data-mode="component">Components</button>
            <button class="tab nav-tab" type="button" data-mode="sbom">SBOM</button>
            <button class="tab nav-tab" type="button" data-mode="status">Status</button>
            <button class="tab nav-tab" type="button" data-mode="admin">Admin</button>
          </div>
        </nav>

        <div class="topbar-actions" aria-label="Header controls">
          <div class="theme-controls" aria-label="Theme color">
            <button class="theme-swatch is-active" type="button" data-theme-color="#1f5f8b" style="--swatch:#1f5f8b" title="CVE blue"></button>
            <button class="theme-swatch" type="button" data-theme-color="#267a5b" style="--swatch:#267a5b" title="Intel green"></button>
            <button class="theme-swatch" type="button" data-theme-color="#a43f3f" style="--swatch:#a43f3f" title="Risk red"></button>
            <button class="theme-swatch" type="button" data-theme-color="#6750a4" style="--swatch:#6750a4" title="Analyst purple"></button>
            <label class="color-picker" title="Custom accent color">
              <input id="themeColorInput" type="color" value="#1f5f8b" aria-label="Custom accent color">
            </label>
          </div>
          <button id="refreshButton" class="icon-button" type="button" title="Refresh data" aria-label="Refresh data">
            <span aria-hidden="true">&#8635;</span>
          </button>
          <button id="authButton" class="tab auth-button" type="button">Login</button>
        </div>
      </div>

    </header>

    <section class="workspace site-body" aria-label="Vulnerability intelligence body">
      <section class="content-pane">
        <section class="results-panel" aria-label="Search results">
          <div class="results-header">
            <div>
              <h2 id="resultsTitle">Vulnerabilities</h2>
              <p id="resultsMeta">Search CVE identifiers, affected packages, titles, and source aliases.</p>
            </div>
          </div>
          <form id="searchForm" class="search-form panel-tools">
            <label class="query-field">
              <span id="queryLabel">Identifier or keyword</span>
              <input id="queryInput" name="query" autocomplete="off" placeholder="CVE-2021-44228">
            </label>
            <div id="componentFields" class="component-fields" hidden>
              <label>
                <span>Vendor</span>
                <input id="vendorInput" name="vendor" autocomplete="off" placeholder="org.apache.logging.log4j">
              </label>
              <label>
                <span>Version</span>
                <input id="versionInput" name="version" autocomplete="off" placeholder="2.14.1">
              </label>
              <label>
                <span>Ecosystem</span>
                <input id="ecosystemInput" name="ecosystem" autocomplete="off" placeholder="maven">
              </label>
            </div>
            <label class="compact-field">
              <span>Sort</span>
              <select id="sortSelect" name="sort">
                <option value="modifiedDesc" selected>Updated</option>
                <option value="publishedDesc">Published</option>
                <option value="identifierDesc">CVE ID</option>
                <option value="cvssDesc">CVSS</option>
                <option value="cvssAsc">CVSS low</option>
              </select>
            </label>
            <button type="submit" class="primary-button">Search</button>
          </form>
          <div class="syntax-hint" id="syntaxHint"></div>
          <div class="result-list" id="resultList" aria-live="polite"></div>
          <div class="results-footer" id="pager">
            <div class="pager">
              <button id="prevPageButton" class="icon-button" type="button" title="Previous page" aria-label="Previous page">&#8592;</button>
              <span id="pageLabel">Page 1</span>
              <button id="nextPageButton" class="icon-button" type="button" title="Next page" aria-label="Next page">&#8594;</button>
            </div>
            <label class="page-size-field">
              <span>Rows per page</span>
              <select id="limitSelect" name="limit">
                <option value="10">10</option>
                <option value="25" selected>25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
            </label>
          </div>
        </section>

        <section class="detail-pane" id="detailPane" aria-live="polite" hidden>
        </section>
      </section>
    </section>

    <footer class="status-footer site-footer" aria-label="System status">
      <div class="footer-divider" aria-hidden="true"></div>
      <div class="footer-line">
        <span class="footer-stat">Index: <strong id="metricRaw">-</strong> raw &middot; <strong id="metricVulns">-</strong> CVEs &middot; <strong id="metricComponents">-</strong> components</span>
        <span class="footer-stat">Pending: <strong id="statusPending">-</strong></span>
        <button id="statusButton" class="footer-stat footer-stat-link" type="button">Status &rarr;</button>
      </div>
      <div class="footer-line footer-copy">
        <small>
          <a href="https://www.cve.org/" target="_blank" rel="noreferrer">CVE</a> &middot;
          <a href="https://nvd.nist.gov/" target="_blank" rel="noreferrer">NVD</a> &middot;
          <a href="https://osv.dev/" target="_blank" rel="noreferrer">OSV</a> &middot;
          &copy; VulTrack 2026
        </small>
      </div>
    </footer>
  </main>

  <dialog id="loginDialog" class="auth-dialog">
    <form id="loginForm" method="dialog" class="auth-form">
      <div>
        <span class="eyebrow">Administrator</span>
        <h2>VulTrack login</h2>
      </div>
      <label>
        <span>Username</span>
        <input id="loginUsername" name="username" autocomplete="username" required>
      </label>
      <label>
        <span>Password</span>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="loginError" class="form-error" hidden></p>
      <div class="dialog-actions">
        <button id="loginCancelButton" class="tab" type="button">Cancel</button>
        <button class="primary-button" type="submit">Login</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js?v=20260603-detail-ui" defer></script>
</body>
</html>
