<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VulTrack</title>
  <link rel="stylesheet" href="/styles.css?v=20260603-sbom-status2">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand-block">
        <h1>VulTrack</h1>
        <p id="statusLine">Loading pipeline state</p>
      </div>
      <nav class="search-console" aria-label="Primary sections">
        <div class="tabs" role="tablist" aria-label="Search mode">
          <button class="tab is-active" type="button" data-mode="vulnerability">Vulnerabilities</button>
          <button class="tab" type="button" data-mode="component">Components</button>
          <button class="tab" type="button" data-mode="sbom">SBOM</button>
          <button class="tab" type="button" data-mode="status">Status</button>
          <button class="tab" type="button" data-mode="admin">Admin</button>
        </div>
      </nav>
      <div class="topbar-actions">
        <div class="theme-controls" aria-label="Theme color">
          <button class="theme-swatch is-active" type="button" data-theme-color="#2f7da7" style="--swatch:#2f7da7" title="Ocean"></button>
          <button class="theme-swatch" type="button" data-theme-color="#2f9f86" style="--swatch:#2f9f86" title="Mint"></button>
          <button class="theme-swatch" type="button" data-theme-color="#d86f73" style="--swatch:#d86f73" title="Coral"></button>
          <button class="theme-swatch" type="button" data-theme-color="#8b6fd6" style="--swatch:#8b6fd6" title="Berry"></button>
          <label class="color-picker" title="Custom accent color">
            <input id="themeColorInput" type="color" value="#2f7da7" aria-label="Custom accent color">
          </label>
        </div>
        <button id="refreshButton" class="icon-button" type="button" title="Refresh data" aria-label="Refresh data">
          <span aria-hidden="true">&#8635;</span>
        </button>
        <button id="authButton" class="tab" type="button">Login</button>
      </div>
    </header>

    <section class="workspace">
      <section class="content-pane">
        <section class="results-panel" aria-label="Search results">
          <div class="results-header">
            <div>
              <h2 id="resultsTitle">Vulnerabilities</h2>
              <p id="resultsMeta">Search CVE identifiers, affected packages, titles, and source aliases.</p>
            </div>
          </div>
          <form id="searchForm" class="search-form panel-tools">
            <label class="query-field">
              <span id="queryLabel">Identifier or keyword</span>
              <input id="queryInput" name="query" autocomplete="off" placeholder="CVE-2021-44228">
            </label>
            <div id="componentFields" class="component-fields" hidden>
              <label>
                <span>Vendor</span>
                <input id="vendorInput" name="vendor" autocomplete="off" placeholder="org.apache.logging.log4j">
              </label>
              <label>
                <span>Version</span>
                <input id="versionInput" name="version" autocomplete="off" placeholder="2.14.1">
              </label>
              <label>
                <span>Ecosystem</span>
                <input id="ecosystemInput" name="ecosystem" autocomplete="off" placeholder="maven">
              </label>
            </div>
            <label class="compact-field">
              <span>Sort</span>
              <select id="sortSelect" name="sort">
                <option value="modifiedDesc" selected>Updated</option>
                <option value="publishedDesc">Published</option>
                <option value="identifierDesc">CVE ID</option>
                <option value="cvssDesc">CVSS</option>
                <option value="cvssAsc">CVSS low</option>
              </select>
            </label>
            <button type="submit" class="primary-button">Search</button>
          </form>
          <div class="syntax-hint" id="syntaxHint"></div>
          <div class="result-list" id="resultList" aria-live="polite"></div>
          <div class="results-footer" id="pager">
            <div class="pager">
              <button id="prevPageButton" class="icon-button" type="button" title="Previous page" aria-label="Previous page">&#8592;</button>
              <span id="pageLabel">Page 1</span>
              <button id="nextPageButton" class="icon-button" type="button" title="Next page" aria-label="Next page">&#8594;</button>
            </div>
            <label class="page-size-field">
              <span>Rows per page</span>
              <select id="limitSelect" name="limit">
                <option value="10">10</option>
                <option value="25" selected>25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
            </label>
          </div>
        </section>

        <section class="detail-pane" id="detailPane" aria-live="polite" hidden>
        </section>
      </section>
    </section>

    <footer class="status-footer" aria-label="System status">
      <button id="statusButton" class="status-pill" type="button">
        <span>Status</span>
        <strong id="statusPending">- pending</strong>
      </button>
      <div class="footer-metric"><span>Vulnerabilities</span><strong id="metricVulns">-</strong></div>
      <div class="footer-metric"><span>Source records</span><strong id="metricRecords">-</strong></div>
      <div class="footer-metric"><span>Affected</span><strong id="metricAffected">-</strong></div>
      <div class="footer-metric"><span>Components</span><strong id="metricComponents">-</strong></div>
      <div class="footer-metric"><span>Sources</span><strong id="metricSources">-</strong></div>
    </footer>
  </main>

  <dialog id="loginDialog" class="auth-dialog">
    <form id="loginForm" method="dialog" class="auth-form">
      <div>
        <span class="eyebrow">Administrator</span>
        <h2>VulTrack login</h2>
      </div>
      <label>
        <span>Username</span>
        <input id="loginUsername" name="username" autocomplete="username" required>
      </label>
      <label>
        <span>Password</span>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="loginError" class="form-error" hidden></p>
      <div class="dialog-actions">
        <button id="loginCancelButton" class="tab" type="button">Cancel</button>
        <button class="primary-button" type="submit">Login</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js?v=20260603-sbom-status2" defer></script>
</body>
</html>
