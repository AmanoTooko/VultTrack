<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VulTrack</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand-block">
        <h1>VulTrack</h1>
        <p id="statusLine">Loading pipeline state</p>
      </div>
      <div class="topbar-actions">
        <div class="theme-controls" aria-label="Theme color">
          <button class="theme-swatch is-active" type="button" data-theme-color="#2f7da7" style="--swatch:#2f7da7" title="Ocean"></button>
          <button class="theme-swatch" type="button" data-theme-color="#2f9f86" style="--swatch:#2f9f86" title="Mint"></button>
          <button class="theme-swatch" type="button" data-theme-color="#d86f73" style="--swatch:#d86f73" title="Coral"></button>
          <button class="theme-swatch" type="button" data-theme-color="#8b6fd6" style="--swatch:#8b6fd6" title="Berry"></button>
          <label class="color-picker" title="Custom accent color">
            <input id="themeColorInput" type="color" value="#2f7da7" aria-label="Custom accent color">
          </label>
        </div>
        <button id="sidebarToggle" class="icon-button" type="button" title="Toggle sidebar" aria-label="Toggle sidebar">
          <span aria-hidden="true" class="sidebar-toggle-icon">☰</span>
        </button>
        <button id="refreshButton" class="icon-button" type="button" title="Refresh data" aria-label="Refresh data">
          <span aria-hidden="true">&#8635;</span>
        </button>
      </div>
    </header>

    <section class="workspace">
      <aside class="search-pane">
        <div class="tabs" role="tablist" aria-label="Search mode">
          <button class="tab is-active" type="button" data-mode="vulnerability">Vulns</button>
          <button class="tab" type="button" data-mode="component">Package</button>
          <button class="tab" type="button" data-mode="sbom">SBOM</button>
          <button class="tab" type="button" data-mode="status">Status</button>
        </div>

        <form id="searchForm" class="search-form">
          <label>
            <span id="queryLabel">Identifier or keyword</span>
            <input id="queryInput" name="query" autocomplete="off" placeholder="CVE-2021-44228">
          </label>
          <div id="componentFields" class="component-fields" hidden>
            <label>
              <span>Vendor</span>
              <input id="vendorInput" name="vendor" autocomplete="off" placeholder="org.apache.logging.log4j">
            </label>
            <label>
              <span>Version</span>
              <input id="versionInput" name="version" autocomplete="off" placeholder="2.14.1">
            </label>
            <label>
              <span>Ecosystem</span>
              <input id="ecosystemInput" name="ecosystem" autocomplete="off" placeholder="maven">
            </label>
          </div>
          <button type="submit" class="primary-button">Search</button>
        </form>

        <div class="result-list" id="resultList" aria-live="polite"></div>
      </aside>

      <section class="detail-pane" id="detailPane" aria-live="polite">
        <div class="empty-state">
          <h2>No selection</h2>
        </div>
      </section>
    </section>

    <footer class="status-footer" aria-label="System status">
      <button id="statusButton" class="status-pill" type="button">
        <span>Status</span>
        <strong id="statusPending">- pending</strong>
      </button>
      <div class="footer-metric"><span>Vulnerabilities</span><strong id="metricVulns">-</strong></div>
      <div class="footer-metric"><span>Source records</span><strong id="metricRecords">-</strong></div>
      <div class="footer-metric"><span>Affected</span><strong id="metricAffected">-</strong></div>
      <div class="footer-metric"><span>Components</span><strong id="metricComponents">-</strong></div>
      <div class="footer-metric"><span>Sources</span><strong id="metricSources">-</strong></div>
    </footer>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
