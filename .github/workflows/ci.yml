name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm test
      - run: dotnet restore tests/VulTrack.Tests/VulTrack.Tests.csproj
      - run: dotnet format whitespace src/VulTrack.App/VulTrack.App.csproj --verify-no-changes --no-restore --verbosity minimal
      - run: dotnet format whitespace tests/VulTrack.Tests/VulTrack.Tests.csproj --verify-no-changes --no-restore --verbosity minimal
      - run: dotnet test tests/VulTrack.Tests/VulTrack.Tests.csproj

  docker:
    runs-on: ubuntu-24.04
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image namespace
        run: echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/VulTrack.App/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/vultrack-api:latest
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/vultrack-api:${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/vultrack-frontend:latest
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/vultrack-frontend:${{ github.sha }}

      # Temporary migration-only image. It has no HTTP listener and is removed from the
      # repository and hosts after both amd64 and arm64 AI restores are verified.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/VulTrack.AiRecovery/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAMESPACE }}/vultrack-ai-recovery:${{ github.sha }}

  deploy:
    runs-on: ubuntu-24.04
    needs: docker
    # Production migration is intentionally opt-in. Set the repository
    # variable VULTRACK_AUTO_DEPLOY=true only after the target host has passed
    # the disk/memory/backup preflight documented in docs/deployment/oracle-arm.md.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VULTRACK_AUTO_DEPLOY == 'true'
    concurrency:
      group: vultrack-production-deploy
      cancel-in-progress: false
    steps:
      - name: Check deploy secrets
        id: deploy_secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets are not configured; skipping remote deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.deploy_secrets.outputs.enabled == 'true'

      - name: Deploy to server
        if: steps.deploy_secrets.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/vultrack_deploy
          chmod 600 ~/.ssh/vultrack_deploy
          port="${DEPLOY_PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vultrack_deploy -p "$port" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -lc "cd /home/ubuntu/vultrack && ./scripts/deploy-prod.sh"'
