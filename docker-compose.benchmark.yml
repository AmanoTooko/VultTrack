services:
  benchmark-postgres:
    image: postgres:16-alpine
    container_name: vultrack-benchmark-postgres
    environment:
      POSTGRES_DB: vultrack
      POSTGRES_USER: vultrack
      POSTGRES_PASSWORD: vultrack-benchmark
    ports:
      - "55432:5432"
    volumes:
      - benchmark-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vultrack -d vultrack"]
      interval: 3s
      timeout: 3s
      retries: 30

  benchmark-api:
    build:
      context: .
      dockerfile: src/VulTrack.App/Dockerfile
    container_name: vultrack-benchmark-api
    working_dir: /workspace/src/VulTrack.App
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DATABASE_URL: postgres://vultrack:vultrack-benchmark@benchmark-postgres:5432/vultrack
      VULTRACK_REPO_ROOT: /workspace
      VULTRACK_DETAIL_SNAPSHOT_DIR: /workspace/data/benchmark-vulnerability-details
      VULTRACK_DUCKDB_ENABLED: "true"
      VULTRACK_DUCKDB_PATH: /workspace/data/benchmark-duckdb/vultrack-evidence.duckdb
      VULTRACK_SCHEDULER_ENABLED: "false"
    volumes:
      - .:/workspace
      - benchmark-raw:/workspace/data/raw-objects
    ports:
      - "5199:8080"
    depends_on:
      benchmark-postgres:
        condition: service_healthy

volumes:
  benchmark-pgdata:
  benchmark-raw:
